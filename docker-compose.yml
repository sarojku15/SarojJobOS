services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: saroj-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata

    volumes:
      - ./n8n:/home/node/.n8n
      - ./config:/files/config
      - ./resumes:/files/resumes
      - ./data:/files/data
      - ./logs:/files/logs

    extra_hosts:
      - "host.docker.internal:host-gateway"
