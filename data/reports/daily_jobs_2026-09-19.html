<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Saroj JobOS — Daily Job Report</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 32px;
    color: #172033;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    margin-bottom: 4px;
}

.subtitle {
    color: #667085;
    margin-bottom: 24px;
}

.summary {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.metric {
    background: white;
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.metric strong {
    font-size: 22px;
    display: block;
}

.job {
    display: flex;
    background: white;
    border-radius: 14px;
    margin-bottom: 16px;
    padding: 20px;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.score {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    margin-right: 20px;
    background: #eef2f6;
}

.score-A {
    background: #dff7e8;
    color: #087443;
}

.score-B {
    background: #e7f0ff;
    color: #175cd3;
}

.score-C {
    background: #fff3d6;
    color: #b54708;
}

.content {
    flex: 1;
}

.topline {
    display: flex;
    gap: 8px;
    margin-bottom: 7px;
}

.priority,
.source,
.status {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 20px;
    background: #eef2f6;
}

h2 {
    margin: 4px 0;
    font-size: 19px;
}

.company {
    font-weight: 600;
    color: #475467;
}

.meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin: 12px 0;
    color: #667085;
    font-size: 13px;
}

.skills {
    margin: 10px 0;
}

.tag {
    display: inline-block;
    padding: 4px 8px;
    margin: 3px;
    border-radius: 6px;
    font-size: 12px;
}

.matched {
    background: #ecfdf3;
    color: #067647;
}

.missing {
    background: #fef3f2;
    color: #b42318;
}

.actions {
    margin-top: 14px;
}

.apply {
    display: inline-block;
    background: #175cd3;
    color: white;
    padding: 9px 14px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 600;
    margin-right: 8px;
}

.joblink {
    color: #175cd3;
    text-decoration: none;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>JobOS — Daily Job Report</h1>
<div class="subtitle">
Generated 19 Sep 2026 11:47 · Manual application workflow
</div>

<div class="summary">
  <div class="metric">
    <strong>0</strong>
    Qualified ≥70
  </div>

  <div class="metric">
    <strong>0</strong>
    Priority A
  </div>

  <div class="metric">
    <strong>0</strong>
    Priority B
  </div>

  <div class="metric">
    <strong>0</strong>
    Priority C
  </div>

  <div class="metric">
    <strong>4</strong>
    Existing lifecycle
  </div>
</div>


    <div class="empty">
      No active jobs with a score of 70 or higher are currently ready
      for manual application.
    </div>
    

</div>
</body>
</html>
