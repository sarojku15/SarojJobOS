<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Job Search OS — Dashboard</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="app-shell-root"></div>
<main id="main-content" class="wide">
  <div class="page-header">
    <div>
      <h1>Dashboard</h1>
      <div class="page-subtitle" id="profile-status"></div>
    </div>
    <div class="page-actions">
      <button class="secondary" onclick="window.location.href='/searches/new'">+ New search</button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="content"><div class="loading-state">Loading...</div></div>
</main>
<script src="/static/app.js"></script>
<script>
renderAppShell('dashboard');
let candidateId = null;

// Real-data-only KPI/status definitions -- every count below is read
// directly from an existing API response field (GET .../dashboard's
// summary, GET .../applications's summary), never invented or
// re-derived with new frontend logic. See api/applications_store.py's
// get_applications_summary() for the authoritative definition of
// "applied"/"interviews"/"offers" this page reuses unchanged.
function renderKpiGrid(dashboardSummary, appsSummary) {
  const jobsFound = dashboardSummary ? dashboardSummary.total_jobs_in_scope : null;
  const applied = appsSummary ? appsSummary.applied : null;
  const interviews = appsSummary ? appsSummary.interviews : null;
  const offers = appsSummary ? appsSummary.offers : null;

  const cards = [
    { label: "Jobs Found", value: jobsFound, cls: "kpi-blue", icon: "searches", note: "Across all your saved searches" },
    { label: "Applications Submitted", value: applied, cls: "kpi-green", icon: "applications", note: "Jobs you've marked as applied" },
    { label: "Interviews", value: interviews, cls: "kpi-amber", icon: "dashboard", note: "Recruiter contact through final round" },
    { label: "Offers", value: offers, cls: "kpi-purple", icon: "profile", note: "Offer stage" },
  ];

  return `
    <div class="kpi-grid">
      ${cards
        .map(
          (c) => `
        <div class="kpi-card ${c.cls}">
          <div class="kpi-top">
            <span class="kpi-label">${escapeHtml(c.label)}</span>
            <span class="kpi-icon">${_navIconSvg(c.icon)}</span>
          </div>
          <div class="kpi-value">${c.value == null ? "—" : c.value}</div>
          <div class="kpi-note">${escapeHtml(c.note)}</div>
        </div>
      `
        )
        .join("")}
    </div>
  `;
}

// CSS-only stacked bar -- no charting dependency. Buckets are the
// SAME mutually-exclusive candidate_status groupings
// get_applications_summary() already computes server-side; "In
// progress" is simply total_applications minus the four buckets the
// API names explicitly, so the bar always accounts for every
// application exactly once (never double-counted, never invented).
function renderStatusChart(appsSummary) {
  if (!appsSummary || !appsSummary.total_applications) {
    return `<div class="empty-state">No applications yet. Approve and mark a job as Applied to see your pipeline here.</div>`;
  }
  const total = appsSummary.total_applications;
  const buckets = [
    { label: "Awaiting Response", count: appsSummary.awaiting_response, color: "var(--info)" },
    { label: "Interviewing", count: appsSummary.interviews, color: "var(--warning)" },
    { label: "Offer", count: appsSummary.offers, color: "var(--success)" },
    { label: "Rejected / Closed", count: appsSummary.rejected, color: "var(--danger)" },
  ];
  const accountedFor = buckets.reduce((sum, b) => sum + b.count, 0);
  const inProgress = Math.max(0, total - accountedFor);
  buckets.push({ label: "In Progress (not yet applied)", count: inProgress, color: "var(--neutral-text)" });

  const segmentsHtml = buckets
    .filter((b) => b.count > 0)
    .map((b) => `<span class="status-bar-segment" style="width:${(b.count / total) * 100}%; background:${b.color}" title="${escapeHtml(b.label)}: ${b.count}"></span>`)
    .join("");

  const legendHtml = buckets
    .filter((b) => b.count > 0)
    .map(
      (b) => `
      <span class="legend-item">
        <span class="legend-swatch" style="background:${b.color}"></span>
        ${escapeHtml(b.label)}: <span class="legend-count">${b.count}</span>
      </span>
    `
    )
    .join("");

  // Screen-reader-friendly summary -- the chart's full information
  // never depends on color alone.
  const srSummary = buckets
    .filter((b) => b.count > 0)
    .map((b) => `${b.label}: ${b.count} of ${total}`)
    .join(", ");

  return `
    <div class="status-bar-wrap">
      <div class="status-bar" role="img" aria-label="Application status distribution: ${escapeHtml(srSummary)}">${segmentsHtml}</div>
      <div class="status-legend">${legendHtml}</div>
      <p class="sr-only">${escapeHtml(srSummary)}</p>
    </div>
  `;
}

function renderRecentActivity(applications) {
  if (!applications.length) {
    return `<div class="empty-state">No recent activity yet. Run a search and shortlist a job to see it here.</div>`;
  }
  return applications
    .slice(0, 6)
    .map((a) => {
      const metaParts = [a.company, a.location || null, a.source].filter(Boolean);
      return `
        <div class="job-row">
          <div>
            <div class="job-row-title">${escapeHtml(a.title || "(untitled)")}</div>
            <div class="job-row-meta">${escapeHtml(metaParts.join(" · "))}</div>
            <div class="job-row-meta">${badgeHtml(a.candidate_status)} updated ${a.updated_at ? new Date(a.updated_at).toLocaleDateString() : "-"}</div>
          </div>
          <div style="text-align:right">
            <div class="job-row-score">${a.fit_score ?? "—"}</div>
            ${a.job_url ? `<a class="job-link" target="_blank" rel="noopener" href="${a.job_url}">View Job</a>` : ""}
          </div>
        </div>
      `;
    })
    .join("");
}

async function load() {
  const content = document.getElementById("content");
  const msg = document.getElementById("msg");

  candidateId = await resolveActiveCandidate();
  if (!candidateId) {
    showEmpty(content, "No candidate selected yet.");
    const cta = el(`<div style="text-align:center;margin-top:16px"><button onclick="window.location.href='/'">Go to Home</button></div>`);
    content.appendChild(cta);
    return;
  }

  try {
    const [data, providerSummary, appsData] = await Promise.all([
      api(`/api/candidates/${candidateId}/dashboard`),
      api("/api/settings/search-providers").catch(() => null),
      api(`/api/candidates/${candidateId}/applications`).catch(() => null),
    ]);
    document.getElementById("profile-status").innerHTML =
      `Profile status: ${badgeHtml(data.profile_status || "DRAFT")}`;

    const appsSummary = appsData ? appsData.summary : null;
    const applications = appsData ? appsData.applications : [];

    content.innerHTML = `
      ${renderKpiGrid(data.summary, appsSummary)}

      <div class="section-card">
        <div class="section-card-header"><h2>Application pipeline</h2></div>
        <div id="status-chart"></div>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Recent activity</h2>
          <button class="secondary small" onclick="window.location.href='/applications'">View all &rarr;</button>
        </div>
        <div id="recent-activity"></div>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Your saved searches</h2></div>
        <div id="search-list"></div>
        <button class="secondary" onclick="window.location.href='/searches/new'">+ New search</button>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Sources</h2></div>
        <div id="sources-block"></div>
        <div class="button-row">
          <button class="secondary" onclick="window.location.href='/import'">+ Import a job manually</button>
        </div>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Follow-ups</h2></div>
        <div id="followups-block"></div>
      </div>

      <div class="section-card">
        <div class="section-card-header"><h2>Excel report</h2></div>
        <p class="hint">Every matched job across every search, in the standard 9-sheet workbook.</p>
        <button id="download-btn">Download Excel report</button>
      </div>
    `;

    document.getElementById("status-chart").innerHTML = renderStatusChart(appsSummary);
    document.getElementById("recent-activity").innerHTML = renderRecentActivity(applications);

    if (!data.summary) {
      document.getElementById("status-chart").insertAdjacentHTML(
        "beforebegin",
        `<div class="hint" style="margin-bottom:8px">Confirm your profile and run a search to see full summary metrics.</div>`
      );
    }

    if (data.sources) {
      renderSourceStatus(document.getElementById("sources-block"), data.sources, providerSummary);
    }

    const list = document.getElementById("search-list");
    if (!data.searches.length) {
      showEmpty(list, "No saved searches yet.");
    } else {
      list.innerHTML = data.searches
        .map((s) => {
          const runInfo = s.latest_run
            ? `${badgeHtml(s.latest_run.status)} last run: ${s.latest_run.jobs_ready ?? 0} ready / ${s.latest_run.jobs_eligible ?? 0} eligible`
            : `<span class="hint">never run</span>`;
          // Which sources were actually searched/zero/failed on the
          // most recent run (Phase 1's search_run_sources audit) --
          // answers "which sources returned zero?" / "which failed?"
          // right on the dashboard, not just on the results page.
          const sourceAudit = s.latest_run ? sourceAuditSummaryHtml(s.latest_run.sources) : "";
          const scheduleInfo = s.schedule && s.schedule.enabled
            ? `${badgeHtml("SCHEDULED", "", `Scheduled (${s.schedule.frequency})`)} next: ${s.schedule.next_run_at ? new Date(s.schedule.next_run_at).toLocaleString() : "-"}`
            : "";
          return `
            <div class="search-list-item">
              <div>
                <b>${escapeHtml(s.name)}</b>
                <div class="meta">${escapeHtml(s.target_roles.join(", "))} &mdash; ${escapeHtml(s.target_locations.join(", "))}</div>
                <div class="meta">${runInfo}</div>
                ${sourceAudit ? `<div class="meta source-audit-summary">${sourceAudit}</div>` : ""}
                ${scheduleInfo ? `<div class="meta">${scheduleInfo}</div>` : ""}
              </div>
              <div class="button-row" style="margin-top:0">
                <button class="small" data-run="${s.saved_search_id}">Run now</button>
                <button class="secondary small" onclick="window.location.href='/searches/${s.saved_search_id}/results'">View results</button>
              </div>
            </div>
          `;
        })
        .join("");

      list.querySelectorAll("[data-run]").forEach((btn) => {
        btn.addEventListener("click", () => runSearch(btn.dataset.run, btn));
      });
    }

    document.getElementById("download-btn").addEventListener("click", () => {
      window.location.href = `/api/candidates/${candidateId}/report`;
    });

    await loadFollowUps();
  } catch (err) {
    showError(msg, err);
  }
}

async function loadFollowUps() {
  const container = document.getElementById("followups-block");
  try {
    const data = await api(`/api/candidates/${candidateId}/follow-ups`);
    const rows = data.follow_ups || [];
    if (!rows.length) {
      showEmpty(container, "No follow-up dates set. Set one from a job's workspace page.");
      return;
    }
    // 2026-09-28: is_overdue/is_due_today/is_upcoming now come directly
    // from the API (scripts/application_follow_ups.py's compute_due_
    // state()) -- the ONE canonical due-state definition every
    // consumer (this widget, the n8n Follow-Up Reminder workflow)
    // shares, instead of each independently recomputing "is this due"
    // (the read-only audit's own finding: this widget used to treat
    // only follow_up_date < today as overdue with no "due today"
    // distinction at all, while n8n used <=, silently disagreeing).
    container.innerHTML = rows
      .slice(0, 10)
      .map((r) => {
        const badge = r.is_overdue ? badgeHtml("OVERDUE") : r.is_due_today ? badgeHtml("DUE_TODAY", "", "Due today") : badgeHtml("UPCOMING", "", "Upcoming");
        return `
          <div class="search-list-item">
            <div>
              <b>${escapeHtml(r.title || "")}</b>
              <div class="meta">${escapeHtml(r.company || "")}</div>
              <div class="meta">${badge} ${escapeHtml(r.follow_up_date)}</div>
            </div>
            <div class="button-row" style="margin-top:0">
              ${r.job_url ? `<a class="job-link" target="_blank" rel="noopener" href="${r.job_url}">View Job</a>` : ""}
              <button class="small secondary" onclick="window.location.href='/applications'">Manage &rarr;</button>
            </div>
          </div>
        `;
      })
      .join("");
  } catch (err) {
    showError(document.getElementById("msg"), err);
  }
}

async function runSearch(searchId, btn) {
  const msg = document.getElementById("msg");
  btn.disabled = true;
  btn.textContent = "Starting...";
  try {
    const { run_id, status } = await api(`/api/searches/${searchId}/run?candidate_id=${candidateId}`, { method: "POST" });
    showSuccess(msg, `Run started: ${status}`);
    pollRun(run_id, btn);
  } catch (err) {
    // 409 already_running (api/main.py's run_search()): this search
    // already has a persisted QUEUED/RUNNING run -- never a generic
    // failure banner, never a second run created. Show the existing
    // run's own status and keep polling it, same as a fresh Run Now.
    const detail = err.data && err.data.detail;
    if (detail && typeof detail === "object" && detail.error === "already_running") {
      showInfo(msg, `Search is already running (${detail.status}).`);
      btn.textContent = `Status: ${detail.status}`;
      pollRun(detail.run_id, btn);
      return;
    }
    showError(msg, err);
    btn.disabled = false;
    btn.textContent = "Run now";
  }
}

async function pollRun(runId, btn) {
  try {
    const run = await api(`/api/runs/${runId}?candidate_id=${candidateId}`);
    btn.textContent = `Status: ${run.status}`;
    if (["COMPLETED", "PARTIAL", "FAILED", "BLOCKED"].includes(run.status)) {
      btn.disabled = false;
      btn.textContent = "Run now";
      load();
      return;
    }
    setTimeout(() => pollRun(runId, btn), 4000);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Run now";
  }
}

load();
</script>
</body>
</html>
